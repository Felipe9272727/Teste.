name: Compilar Flappy Goose APK (Goose de verdade)
on:
  push:
    branches: [main, master, "goose-flappy-android", "goose-openworld-20261106", "goose-native-renderer-20261106", "goose-skies-blender-v5-20261106"]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Baixar compilador Goose v2026.3 (binario oficial)
        run: |
          mkdir -p "$RUNNER_TEMP/goose"
          curl -fsSL --retry 3 https://github.com/aardappel/goose/releases/download/v2026.3/goose-v2026.3-linux-x64.tar.gz | tar -xz -C "$RUNNER_TEMP/goose"
          GOOSE_BIN="$(find "$RUNNER_TEMP/goose" -type f -name goose -print -quit)"
          test -n "$GOOSE_BIN"
          chmod +x "$GOOSE_BIN"
          echo "GOOSE_BIN=$GOOSE_BIN" >> "$GITHUB_ENV"
          "$GOOSE_BIN" version

      - name: Modelagem 3D real usando Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends blender
          blender -b --factory-startup --python assets/blender/make_assets.py
          test -s assets/generated/goose_assets.h
          test -s assets/generated/GooseSkies_Character_Assets.blend

      - name: Gerar C do codigo Goose (export fn)
        run: |
          "$GOOSE_BIN" check goose/flappy.goose
          mkdir -p android/app/src/main/cpp/generated
          "$GOOSE_BIN" --standalone --header android/app/src/main/cpp/generated/flappy.h \
            -o android/app/src/main/cpp/generated/flappy.c goose/flappy.goose

      - name: Android SDK e NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Compilar biblioteca ARM64 Android usando NDK
        run: |
          CLANG="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          "$CLANG" -O2 -fPIC -shared \
            -Iandroid/app/src/main/cpp/generated -Iassets/generated \
            android/app/src/main/cpp/generated/flappy.c \
            android/app/src/main/cpp/bridge.c \
            -o android/app/src/main/jniLibs/arm64-v8a/libflappygoose.so \
            -lGLESv2 -lEGL -landroid -llog -lm -ldl -pthread

      - name: Montar APK de debug
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: GooseSkies-Blender-V5-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            assets/generated/GooseSkies_Character_Assets.blend