plugins {
    id 'com.android.application'
}
android {
    namespace 'com.goose.flappy'
    compileSdk 35

    defaultConfig {
        applicationId 'com.goose.skies'
        minSdk 24
        targetSdk 28
        versionCode 3
        versionName '3.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}