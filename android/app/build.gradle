plugins {
    id 'com.android.application'
}
android {
    namespace 'com.goose.flappy'
    compileSdk 35

    defaultConfig {
        applicationId 'com.goose.skies.blenderv5'
        minSdk 24
        targetSdk 28
        versionCode 5
        versionName '5.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}